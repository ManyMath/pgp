name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Analyze & test (Dart/Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/pgp/rust
      # The pub workspace includes Flutter packages, so resolve with Flutter.
      - run: flutter pub get
      - name: Check formatting
        run: >-
          dart format --output none --set-exit-if-changed
          packages/pgp_dart packages/pgp/lib packages/pgp/test
          packages/pgp/example/lib packages/pgp/example/integration_test
      - run: dart analyze packages/pgp_dart
      - run: python3 tool/check_windows_wrapper.py
      - run: flutter analyze packages/pgp
      - run: cargo build --release --manifest-path packages/pgp/rust/Cargo.toml
      - run: dart test packages/pgp_dart
      # Scope to the plugin's own tests (not the vendored cargokit tests).
      - run: flutter test packages/pgp/test

  build:
    name: Build example (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            build: flutter build linux --debug
          - name: apk
            os: ubuntu-latest
            build: flutter build apk --debug
          - name: macos
            os: macos-latest
            build: flutter build macos --debug
          - name: ios
            os: macos-latest
            build: flutter build ios --debug --no-codesign
          - name: windows
            os: windows-latest
            build: flutter build windows --debug
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # No rust-cache here: cargokit builds into the example's build/ dir.
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop build deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config
      - run: flutter pub get
      - name: Build ${{ matrix.name }}
        working-directory: packages/pgp/example
        run: ${{ matrix.build }}

  # Builds the packages the way a pub.dev consumer gets them (exported without
  # the monorepo, fresh `flutter create` app), which the example build above
  # can't catch.
  consumer:
    name: Consumer build & publish dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/pgp/rust
      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config
      - run: tool/consumer_build.sh linux apk
      - run: flutter pub get
      - name: Publish dry-run (pgp_dart, pgp)
        run: |
          (cd packages/pgp_dart && dart pub publish --dry-run)
          (cd packages/pgp && flutter pub publish --dry-run)
      - name: Package the crate
        run: cargo publish --dry-run --manifest-path packages/pgp/rust/Cargo.toml
