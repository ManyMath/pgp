name: pgp-ffi release

on:
  pull_request:
    paths:
      - "packages/pgp_flutter/rust/**"
      - ".github/workflows/pgp-ffi-release.yml"
  push:
    tags:
      - "pgp-ffi-v*"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  check-header:
    name: Header is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --features header --manifest-path packages/pgp_flutter/rust/Cargo.toml
      - name: Fail if cbindgen output drifted from the committed header
        run: git diff --exit-code -- packages/pgp_flutter/rust/pgp-ffi.h

  unit-tests:
    name: Rust unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --lib --manifest-path packages/pgp_flutter/rust/Cargo.toml

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --manifest-path packages/pgp_flutter/rust/Cargo.toml --lib --tests -- -D warnings

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Scan dependencies for known vulnerabilities
        working-directory: packages/pgp_flutter/rust
        run: |
          # The lockfile covers every backend, so it still lists the
          # RustCrypto crates behind the opt-in crypto-rust feature:
          # RUSTSEC-2023-0071 (rsa, no fix), RUSTSEC-2026-0387
          # (crypto-bigint) and RUSTSEC-2026-0385 (ctutils). The
          # default-backend job checks they are not in the default tree.
          cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0387 --ignore RUSTSEC-2026-0385

  default-backend:
    name: Default backend tree is free of the audited crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Vulnerable RustCrypto crates are absent from the default tree
        working-directory: packages/pgp_flutter/rust
        run: |
          for crate in crypto-bigint ctutils rsa; do
            if cargo tree -i "$crate" 2>/dev/null; then
              echo "::error::$crate is in the default dependency tree"
              exit 1
            fi
          done

  rust-backend:
    name: crypto-rust backend (development only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --lib --no-default-features --features crypto-rust --manifest-path packages/pgp_flutter/rust/Cargo.toml

  c-smoke-test:
    name: C smoke test (test.c)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --manifest-path packages/pgp_flutter/rust/Cargo.toml
      - name: Compile and run test.c against the freshly built cdylib
        working-directory: packages/pgp_flutter/rust
        run: |
          gcc test.c -I. -L./target/debug -lpgp_ffi -o test_runner
          LD_LIBRARY_PATH=./target/debug ./test_runner

  asan:
    name: AddressSanitizer (use-after-free, leaks)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Zsanitizer=address
      ASAN_OPTIONS: detect_leaks=1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-gnu
          components: rust-src

      - name: Run the suite under ASan
        run: |
          cargo test -Zbuild-std --target x86_64-unknown-linux-gnu \
            --manifest-path packages/pgp_flutter/rust/Cargo.toml -- --skip use_after_free_detected_under_asan

      - name: Confirm ASan catches the deliberate use-after-free
        run: |
          if cargo test -Zbuild-std --target x86_64-unknown-linux-gnu \
            --manifest-path packages/pgp_flutter/rust/Cargo.toml -- --ignored --exact tests::use_after_free_detected_under_asan
          then
            echo "::error::expected the use-after-free test to abort under ASan, but it passed"
            exit 1
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: [check-header, unit-tests, clippy, audit, default-backend, rust-backend, c-smoke-test, asan]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib_file: libpgp_ffi.so
            cross: false
            smoke_test: true
          - name: linux-aarch64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            lib_file: libpgp_ffi.so
            cross: true
            smoke_test: false # cross-compiled; runner can't execute an aarch64 binary
          - name: macos-x86_64
            runner: macos-13
            target: x86_64-apple-darwin
            lib_file: libpgp_ffi.dylib
            cross: false
            smoke_test: true
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            lib_file: libpgp_ffi.dylib
            cross: false
            smoke_test: true
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            lib_file: pgp_ffi.dll
            cross: false
            smoke_test: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (native)
        if: ${{ !matrix.cross }}
        shell: bash
        run: cargo build --release --manifest-path packages/pgp_flutter/rust/Cargo.toml --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        shell: bash
        run: cross build --release --manifest-path packages/pgp_flutter/rust/Cargo.toml --target ${{ matrix.target }}

      - name: Set up Dart
        if: matrix.smoke_test
        uses: dart-lang/setup-dart@v1

      - name: Smoke test the built artifact against the Dart test suite
        if: matrix.smoke_test
        shell: bash
        run: |
          mkdir -p packages/pgp_flutter/rust/target/release
          cp packages/pgp_flutter/rust/target/${{ matrix.target }}/release/${{ matrix.lib_file }} packages/pgp_flutter/rust/target/release/
          dart pub get --directory packages/pgp_dart
          dart test packages/pgp_dart

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          cp packages/pgp_flutter/rust/target/${{ matrix.target }}/release/${{ matrix.lib_file }} "$stage/"
          archive="pgp-ffi-${{ matrix.name }}"
          if [[ "${{ matrix.runner }}" == windows-* ]]; then
            (cd "$stage" && 7z a "${GITHUB_WORKSPACE}/${archive}.zip" "${{ matrix.lib_file }}")
            sha256sum "${archive}.zip" > "${archive}.zip.sha256"
          else
            tar -C "$stage" -czf "${archive}.tar.gz" "${{ matrix.lib_file }}"
            shasum -a 256 "${archive}.tar.gz" > "${archive}.tar.gz.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pgp-ffi-${{ matrix.name }}
          path: |
            pgp-ffi-${{ matrix.name }}.tar.gz
            pgp-ffi-${{ matrix.name }}.tar.gz.sha256
            pgp-ffi-${{ matrix.name }}.zip
            pgp-ffi-${{ matrix.name }}.zip.sha256
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/pgp-ffi-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
