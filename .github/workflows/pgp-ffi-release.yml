name: Release pgp_ffi

on:
  push:
    tags:
      - 'pgp-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.asset_key }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset_key: linux-x64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            lib_file: libpgp_ffi.so
            cargo_args: --locked
          - asset_key: linux-arm64
            os: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
            lib_file: libpgp_ffi.so
            cargo_args: --locked
          - asset_key: macos-x64
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
            lib_file: libpgp_ffi.dylib
            cargo_args: --locked
            macosx_deployment_target: '11.0'
          - asset_key: macos-arm64
            os: macos-latest
            rust_target: aarch64-apple-darwin
            lib_file: libpgp_ffi.dylib
            cargo_args: --locked
            macosx_deployment_target: '11.0'
          - asset_key: windows-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            lib_file: pgp_ffi.dll
            cargo_args: --locked --no-default-features --features crypto-cng

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          targets: ${{ matrix.rust_target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y perl pkg-config
      - name: Build native library
        working-directory: packages/pgp/native
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}
        run: cargo build --release --target ${{ matrix.rust_target }} ${{ matrix.cargo_args }}
      - name: Package tarball and SHA-256 (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "packages/pgp/native/target/${{ matrix.rust_target }}/release/${{ matrix.lib_file }}" dist/
          archive="pgp_ffi-${{ matrix.asset_key }}.tar.gz"
          COPYFILE_DISABLE=1 tar -C dist -czf "dist/$archive" "${{ matrix.lib_file }}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$archive" > "$archive.sha256")
          else
            (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
          fi
      - name: Package tarball and SHA-256 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "packages\pgp\native\target\${{ matrix.rust_target }}\release\${{ matrix.lib_file }}" dist\
          $archive = "pgp_ffi-${{ matrix.asset_key }}.tar.gz"
          tar.exe -C dist -czf "dist\$archive" "${{ matrix.lib_file }}"
          $hash = (Get-FileHash -Algorithm SHA256 "dist\$archive").Hash.ToLowerInvariant()
          "$hash  $archive" | Out-File -Encoding ascii -NoNewline "dist\$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: pgp_ffi-${{ matrix.asset_key }}
          path: |
            dist/pgp_ffi-${{ matrix.asset_key }}.tar.gz
            dist/pgp_ffi-${{ matrix.asset_key }}.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Build combined SHA256SUMS.txt
        run: |
          cd release-assets
          sha256sum *.tar.gz | tee SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/pgp-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.tar.gz
            release-assets/*.tar.gz.sha256
            release-assets/SHA256SUMS.txt
