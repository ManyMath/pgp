name: pgp_workspace
publish_to: none

environment:
  sdk: ^3.10.0

workspace:
  - packages/pgp_dart
  - packages/pgp

dev_dependencies:
  melos: ^7.0.0

melos:
  name: pgp
  scripts:
    analyze:
      description: Analyze all packages.
      run: dart analyze packages/pgp_dart packages/pgp
    format:
      description: Check Dart formatting.
      run: dart format --output none --set-exit-if-changed packages/pgp_dart packages/pgp
    format:fix:
      description: Apply Dart formatting.
      run: dart format packages/pgp_dart packages/pgp
    test:
      description: Run all Dart tests.
      run: (cd packages/pgp_dart && dart test) && (cd packages/pgp && dart test)
    native:build:
      description: Build the pgp_ffi shared library.
      run: cargo build --release --manifest-path packages/pgp/native/Cargo.toml
    native:test:
      description: Run the Rust crate tests.
      run: cargo test --lib --manifest-path packages/pgp/native/Cargo.toml
