name: pgp
description: >-
  OpenPGP for Flutter, backed by Sequoia. Integrates the `pgp_dart` package
  and uses cargokit to build the native pgp_ffi Rust library and use it via
  FFI.
version: 0.0.1
repository: https://github.com/ManyMath/pgp/tree/main/packages/pgp
issue_tracker: https://github.com/ManyMath/pgp/issues
topics:
  - pgp
  - openpgp
  - cryptography
  - ffi

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  pgp_dart: ^0.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
