[package]
name = "pgp-ffi"
version = "0.0.1"
edition = "2021"
description = "OpenPGP and Sequoia FFI bindings"
repository = "https://github.com/ManyMath/pgp"
license = "MIT"
readme = "README.md"
keywords = ["openpgp", "pgp", "sequoia", "ffi"]
categories = ["cryptography", "external-ffi-bindings"]
exclude = ["test.c", "test_runner"]

[lib]
name = "pgp_ffi"
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
sequoia-openpgp = { version = "2", default-features = false }
libc = "0.2"
openssl-sys = { version = "0.9", optional = true }
anyhow = "1"

[features]
default = ["crypto-openssl-vendored"]
# Pure Rust backend. Sequoia gates it behind the two allow-* features because
# it is experimental and not constant-time, and its dependency tree carries
# open timing advisories. Development only; not the default.
crypto-rust = [
    "sequoia-openpgp/crypto-rust",
    "sequoia-openpgp/allow-experimental-crypto",
    "sequoia-openpgp/allow-variable-time-crypto",
]
crypto-openssl = ["sequoia-openpgp/crypto-openssl"]
# OpenSSL built from source and linked statically, for targets with no system
# OpenSSL (Windows, Android, iOS, macOS). Needs perl, make and a C compiler.
crypto-openssl-vendored = ["crypto-openssl", "dep:openssl-sys", "openssl-sys/vendored"]
crypto-nettle = ["sequoia-openpgp/crypto-nettle"]
# Windows CNG. Needs nothing beyond the OS.
crypto-cng = ["sequoia-openpgp/crypto-cng"]
# Regenerate pgp-ffi.h during the build.
header = ["dep:cbindgen"]

[build-dependencies]
cbindgen = { version = "0.27.0", optional = true }

[profile.release]
# Abort on panic: unwinding across the C ABI (extern "C") boundary is undefined
# behavior, so turn any panic in the shipped cdylib into a defined abort.
panic = "abort"
strip = true
lto = true
opt-level = "z"
codegen-units = 1
