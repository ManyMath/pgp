name: pgp_dart
description: >-
  OpenPGP for Dart, backed by Sequoia. Dart (no Flutter dependency) with the
  native pgp_ffi library reached over FFI.
version: 0.0.1
repository: https://github.com/ManyMath/pgp/tree/main/packages/pgp_dart
issue_tracker: https://github.com/ManyMath/pgp/issues
topics:
  - pgp
  - openpgp
  - cryptography
  - ffi

environment:
  sdk: ^3.10.0

resolution: workspace

dependencies:
  ffi: ^2.1.3

dev_dependencies:
  ffigen: ^20.0.0
  lints: ^6.0.0
  test: ^1.24.0
