[package]
name = "pgp-ffi-windows"
version = "0.0.1"
edition = "2021"
publish = false
description = "pgp-ffi built on the Windows CNG backend for pgp_flutter's cargokit."
license = "MIT"
repository = "https://github.com/ManyMath/pgp-dart"

# Compiles the same source as ../../rust with the CNG backend. The crate's
# default vendored OpenSSL needs a native perl and NASM to build with MSVC; CNG
# needs nothing beyond the OS. tool/check_windows_wrapper.py keeps the
# dependencies, library name and release profile in step with ../../rust.
[lib]
name = "pgp_ffi"
path = "../../rust/src/lib.rs"
crate-type = ["cdylib", "staticlib"]

[dependencies]
sequoia-openpgp = { version = "2", default-features = false, features = ["crypto-cng"] }
libc = "0.2"
anyhow = "1"

[profile.release]
panic = "abort"
strip = true
lto = true
opt-level = "z"
codegen-units = 1
