name: pgp_flutter_example
description: "Demonstrates how to use the pgp_flutter plugin."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # The example ships with the plugin, so it depends on the parent directory.
  pgp_flutter:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
