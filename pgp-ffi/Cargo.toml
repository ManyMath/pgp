[package]
name = "pgp-ffi"
version = "0.0.1"
edition = "2021"
description = "OpenPGP and Sequoia FFI bindings"
repository = "https://github.com/ManyMath/pgp-ffi"
license = "MIT"
readme = "README.md"
keywords = ["openpgp", "pgp", "sequoia", "ffi"]
categories = ["cryptography", "external-ffi-bindings"]
exclude = ["test.c", "test_runner"]

[lib]
name = "pgp_ffi"
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "pgp_ffi"
path = "src/main.rs"

[dependencies]
sequoia-openpgp = { version = "2", default-features = false }
libc = "0.2"
anyhow = "1"

[features]
default = ["crypto-rust"]
# Pure Rust backend. Sequoia gates it behind the two allow-* features because
# it is experimental and not constant-time. Prefer crypto-openssl or
# crypto-nettle for anything beyond development.
crypto-rust = [
    "sequoia-openpgp/crypto-rust",
    "sequoia-openpgp/allow-experimental-crypto",
    "sequoia-openpgp/allow-variable-time-crypto",
]
crypto-openssl = ["sequoia-openpgp/crypto-openssl"]
crypto-nettle = ["sequoia-openpgp/crypto-nettle"]

[build-dependencies]
cbindgen = "0.27.0"

[profile.release]
# Abort on panic: unwinding across the C ABI (extern "C") boundary is undefined
# behavior, so turn any panic in the shipped cdylib into a defined abort.
panic = "abort"
strip = true
lto = true
opt-level = "z"
codegen-units = 1
